<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="カスタム研修のイメージ">
  <defs>
    <radialGradient id="spot" cx="30%" cy="22%" r="95%"><stop offset="0" stop-color="#2a447f"/><stop offset="52%" stop-color="#16234c"/><stop offset="100%" stop-color="#091029"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset="1" stop-color="#bb8a30"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ceee6"/><stop offset="1" stop-color="#4aa6d8"/></linearGradient>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eccd7c" stop-opacity=".5"/><stop offset="100%" stop-color="#eccd7c" stop-opacity="0"/></radialGradient>
    <radialGradient id="ac" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#56c7d6" stop-opacity=".5"/><stop offset="100%" stop-color="#56c7d6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7e93c8" stroke-opacity=".09"/></pattern>
    <style>@keyframes f{0%,100%{transform:rotate(0)}100%{transform:rotate(360deg)}}.spin{transform-origin:186px 186px;animation:f 18s linear infinite}@media(prefers-reduced-motion:reduce){.spin{animation:none}}</style>
  </defs>
  <rect width="480" height="360" fill="url(#spot)"/>
  <circle cx="400" cy="60" r="150" fill="url(#ag)"/><circle cx="70" cy="330" r="150" fill="url(#ac)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <!-- puzzle A (glass, gold edge) -->
  <path d="M150 140 h44 a14 14 0 0 1 28 0 h44 v44 a14 14 0 0 0 0 28 v44 h-44 a14 14 0 0 1 -28 0 h-44 v-44 a14 14 0 0 0 0 -28 z" fill="#ffffff" fill-opacity=".06" stroke="url(#gold)" stroke-width="2"/>
  <!-- puzzle B (glass, cyan edge) -->
  <path d="M250 196 h36 a12 12 0 0 1 24 0 h36 v36 a12 12 0 0 0 0 24 v36 h-36 a12 12 0 0 1 -24 0 h-36 v-36 a12 12 0 0 0 0 -24 z" fill="#ffffff" fill-opacity=".05" stroke="url(#cy)" stroke-width="2"/>
  <!-- gear accent -->
  <g class="spin" filter="url(#glow)"><g transform="translate(186,186)">
    <circle r="14" fill="#13204a" stroke="url(#gold)" stroke-width="2"/><circle r="5" fill="url(#gold)"/>
    <g fill="url(#gold)"><rect x="-2.5" y="-20" width="5" height="7" rx="2"/><rect x="-2.5" y="13" width="5" height="7" rx="2"/><rect x="-20" y="-2.5" width="7" height="5" rx="2"/><rect x="13" y="-2.5" width="7" height="5" rx="2"/></g>
  </g></g>
</svg>
