<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="外付けDX事業部アウトソーシングのイメージ">
  <defs>
    <radialGradient id="spot" cx="30%" cy="22%" r="95%"><stop offset="0" stop-color="#2a447f"/><stop offset="52%" stop-color="#16234c"/><stop offset="100%" stop-color="#091029"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset="1" stop-color="#bb8a30"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ceee6"/><stop offset="1" stop-color="#4aa6d8"/></linearGradient>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eccd7c" stop-opacity=".5"/><stop offset="100%" stop-color="#eccd7c" stop-opacity="0"/></radialGradient>
    <radialGradient id="ac" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#56c7d6" stop-opacity=".5"/><stop offset="100%" stop-color="#56c7d6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7e93c8" stroke-opacity=".09"/></pattern>
    <style>@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.pulse{animation:p 2.6s ease-in-out infinite}.float{animation:f 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.float{animation:none}}</style>
  </defs>
  <rect width="480" height="360" fill="url(#spot)"/>
  <circle cx="400" cy="60" r="150" fill="url(#ag)"/><circle cx="64" cy="330" r="150" fill="url(#ac)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <!-- company building (glass) -->
  <rect x="120" y="118" width="120" height="170" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
  <g fill="#aebfe6" opacity=".8"><rect x="138" y="140" width="20" height="20" rx="3"/><rect x="170" y="140" width="20" height="20" rx="3"/><rect x="202" y="140" width="20" height="20" rx="3"/><rect x="138" y="174" width="20" height="20" rx="3"/><rect x="202" y="174" width="20" height="20" rx="3"/></g>
  <rect class="pulse" x="170" y="174" width="20" height="20" rx="3" fill="url(#gold)" filter="url(#glow)"/>
  <rect x="162" y="240" width="36" height="48" rx="4" fill="#ffffff" fill-opacity=".05"/>
  <!-- connection -->
  <path d="M250 198 h54" stroke="url(#cy)" stroke-width="3" stroke-dasharray="3 9" fill="none" filter="url(#glow)"/>
  <!-- AI agent person -->
  <g class="float"><g transform="translate(348,166)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#ffffff" fill-opacity=".06" stroke="url(#gold)" stroke-width="2"/>
    <g stroke="url(#cy)" stroke-width="1.6" fill="none" opacity=".9"><path d="M-10 -6 0 -12M0 -12 11 -4M-10 -6 -4 6M11 -4 4 8M-4 6 4 8"/></g>
    <g fill="url(#cy)"><circle cx="-10" cy="-6" r="3"/><circle cx="0" cy="-12" r="3"/><circle cx="11" cy="-4" r="3"/><circle cx="-4" cy="6" r="3"/><circle cx="4" cy="8" r="3"/></g>
    <path d="M-26 60 q26 -34 52 0 l0 4 -52 0 z" fill="#dbe6ff"/>
  </g></g>
  <!-- visit calendar (glass) -->
  <g transform="translate(300,266)">
    <rect x="0" y="0" width="120" height="58" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#ffffff" fill-opacity=".06"/>
    <g fill="#7d93c4"><circle cx="20" cy="34" r="5"/><circle cx="44" cy="34" r="5"/><circle cx="92" cy="34" r="5"/><circle cx="20" cy="48" r="5"/><circle cx="92" cy="48" r="5"/></g>
    <circle cx="68" cy="34" r="6" fill="url(#gold)"/><circle cx="44" cy="48" r="6" fill="url(#gold)"/>
  </g>
</svg>
