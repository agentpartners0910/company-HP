<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="生成AI実践研修のイメージ">
  <defs>
    <radialGradient id="spot" cx="30%" cy="22%" r="95%"><stop offset="0" stop-color="#2a447f"/><stop offset="52%" stop-color="#16234c"/><stop offset="100%" stop-color="#091029"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset="1" stop-color="#bb8a30"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ceee6"/><stop offset="1" stop-color="#4aa6d8"/></linearGradient>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eccd7c" stop-opacity=".5"/><stop offset="100%" stop-color="#eccd7c" stop-opacity="0"/></radialGradient>
    <radialGradient id="ac" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#56c7d6" stop-opacity=".5"/><stop offset="100%" stop-color="#56c7d6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7e93c8" stroke-opacity=".09"/></pattern>
    <style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}.cursor{animation:blink 1.1s step-end infinite}.pulse{animation:p 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.cursor,.pulse{animation:none}}</style>
  </defs>
  <rect width="480" height="360" fill="url(#spot)"/>
  <circle cx="400" cy="60" r="150" fill="url(#ag)"/><circle cx="70" cy="330" r="150" fill="url(#ac)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <!-- prompt box (glass) -->
  <rect x="116" y="146" width="248" height="60" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="140" y="184" font-family="monospace" font-size="24" fill="url(#cy)">&gt;_</text>
  <rect x="186" y="168" width="118" height="9" rx="4.5" fill="#aebfe6" opacity=".7"/>
  <rect class="cursor" x="332" y="164" width="14" height="26" rx="3" fill="url(#gold)" filter="url(#glow)"/>
  <!-- output card -->
  <rect x="150" y="226" width="180" height="68" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/>
  <g fill="url(#cy)" opacity=".8"><rect x="168" y="244" width="120" height="8" rx="4"/><rect x="168" y="262" width="96" height="8" rx="4"/><rect x="168" y="280" width="140" height="8" rx="4"/></g>
  <!-- generative spark -->
  <path class="pulse" d="M300 96 l7 19 19 7 -19 7 -7 19 -7 -19 -19 -7 19 -7 z" fill="url(#gold)" filter="url(#glow)"/>
</svg>
