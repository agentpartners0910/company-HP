<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="採用・共に挑む仲間募集のイメージ">
  <defs>
    <radialGradient id="spot" cx="30%" cy="22%" r="95%"><stop offset="0" stop-color="#2a447f"/><stop offset="52%" stop-color="#16234c"/><stop offset="100%" stop-color="#091029"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset="1" stop-color="#bb8a30"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ceee6"/><stop offset="1" stop-color="#4aa6d8"/></linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4aa6d8"/><stop offset="1" stop-color="#f6e2a6"/></linearGradient>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eccd7c" stop-opacity=".5"/><stop offset="100%" stop-color="#eccd7c" stop-opacity="0"/></radialGradient>
    <radialGradient id="ac" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#56c7d6" stop-opacity=".5"/><stop offset="100%" stop-color="#56c7d6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7e93c8" stroke-opacity=".09"/></pattern>
    <style>@keyframes p{0%,100%{opacity:.5}50%{opacity:1}}.pulse{animation:p 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
  </defs>
  <rect width="480" height="360" fill="url(#spot)"/>
  <circle cx="404" cy="60" r="150" fill="url(#ag)"/><circle cx="60" cy="330" r="150" fill="url(#ac)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <!-- growth path -->
  <path d="M120 280 L210 200 L270 240 L380 120" fill="none" stroke="url(#up)" stroke-width="3" stroke-dasharray="3 11" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M380 120 l3 -27 -26 9 z" fill="url(#gold)" filter="url(#glow)"/>
  <!-- connection -->
  <line x1="196" y1="214" x2="300" y2="214" stroke="url(#cy)" stroke-width="2" stroke-opacity=".6"/>
  <!-- two figures -->
  <g filter="url(#glow)">
    <g transform="translate(196,214)"><circle cx="0" cy="0" r="18" fill="url(#gold)"/><path d="M-20 26 q20 -18 40 0 l0 40 -40 0 z" fill="#dbe6ff"/></g>
    <g transform="translate(300,214)"><circle cx="0" cy="0" r="18" fill="url(#cy)"/><path d="M-20 26 q20 -18 40 0 l0 40 -40 0 z" fill="#9fb4e0"/></g>
  </g>
  <!-- new growth -->
  <g filter="url(#glow)"><circle class="pulse" cx="248" cy="118" r="7" fill="url(#gold)"/></g>
  <g stroke="url(#cy)" stroke-width="2.5" fill="none"><path d="M248 130 q-18 6 -24 -8M248 130 q18 6 24 -8"/></g>
</svg>
