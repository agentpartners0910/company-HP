<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="ハードウェア販売事業者との協業のイメージ">
  <defs>
    <radialGradient id="spot" cx="30%" cy="22%" r="95%"><stop offset="0" stop-color="#2a447f"/><stop offset="52%" stop-color="#16234c"/><stop offset="100%" stop-color="#091029"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset="1" stop-color="#bb8a30"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ceee6"/><stop offset="1" stop-color="#4aa6d8"/></linearGradient>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eccd7c" stop-opacity=".5"/><stop offset="100%" stop-color="#eccd7c" stop-opacity="0"/></radialGradient>
    <radialGradient id="ac" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#56c7d6" stop-opacity=".5"/><stop offset="100%" stop-color="#56c7d6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7e93c8" stroke-opacity=".09"/></pattern>
    <style>@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}.pulse{animation:p 2.6s ease-in-out infinite}.pulse2{animation:p 2.6s ease-in-out infinite;animation-delay:-1.3s}@media(prefers-reduced-motion:reduce){.pulse,.pulse2{animation:none}}</style>
  </defs>
  <rect width="480" height="360" fill="url(#spot)"/>
  <circle cx="400" cy="60" r="150" fill="url(#ag)"/><circle cx="70" cy="330" r="150" fill="url(#ac)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <!-- server stack (glass) -->
  <g fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"><rect x="120" y="118" width="120" height="40" rx="9"/><rect x="120" y="166" width="120" height="40" rx="9"/><rect x="120" y="214" width="120" height="40" rx="9"/></g>
  <g filter="url(#glow)"><circle class="pulse" cx="140" cy="138" r="5" fill="url(#cy)"/><circle class="pulse2" cx="140" cy="186" r="5" fill="url(#cy)"/><circle class="pulse" cx="140" cy="234" r="5" fill="url(#gold)"/></g>
  <g fill="#aebfe6" opacity=".7"><rect x="158" y="134" width="60" height="8" rx="4"/><rect x="158" y="182" width="60" height="8" rx="4"/><rect x="158" y="230" width="60" height="8" rx="4"/></g>
  <!-- plus -->
  <g stroke="url(#gold)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"><path d="M266 188 294 188M280 174 280 202"/></g>
  <!-- software card (glass) -->
  <rect x="312" y="148" width="116" height="80" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2"/>
  <g fill="url(#cy)" opacity=".8"><rect x="330" y="166" width="80" height="8" rx="4"/><rect x="330" y="182" width="56" height="8" rx="4"/></g>
  <rect x="330" y="200" width="42" height="13" rx="6.5" fill="url(#gold)"/>
  <!-- interlocking rings -->
  <g fill="none" stroke-width="4" filter="url(#glow)"><circle cx="278" cy="292" r="22" stroke="url(#gold)"/><circle cx="306" cy="292" r="22" stroke="url(#cy)"/></g>
</svg>
